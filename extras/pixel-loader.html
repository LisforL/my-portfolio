/* A saved copy of the portfolio's pixel loading screen, on its own page so it can be kept and
   reused. The page behind it is a stand-in: paper with the disc in the same spot. */
:root { color-scheme: light; --paper: #f7f4f0; --wine: #400d1b; --accent: #8760af; }
html, body { margin: 0; height: 100%; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--paper); color: var(--wine); font: 500 12px/1.5 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
#disc { position: fixed; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px rgba(135,96,175,.45); }
.cap { position: fixed; left: 0; right: 0; text-align: center; letter-spacing: .14em; text-transform: uppercase; }
.cap b { font-weight: 500; color: var(--accent); }
#replay { position: fixed; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px)); transform: translateX(-50%);
  font: inherit; letter-spacing: .14em; text-transform: uppercase; padding: 12px 22px; border: 1px solid var(--wine);
  background: transparent; color: var(--wine); cursor: pointer; opacity: 0; transition: opacity .6s ease .4s; }
#replay:hover { background: var(--wine); color: var(--paper); }
body:not(.loading) #replay { opacity: 1; }
#loader { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 19; display: block; cursor: progress; background: #23121a; }
#loaderNote { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; position: fixed; }
</style>

<script>
/* ── Loading screen: the record, pixel by pixel ──
   The screen is a grid of small cells, each holding a faint 0 or 1 that now and then flips, with a
   scan line drifting down through it (the same pixel language as the 0/1 band above About). In
   the middle, the cover resolves inside the disc's circle: cells switch from digits to picture in
   a random order while the picture sharpens from big blocks to fine ones, and the disc's rim
   fills clockwise in pixels as the progress. At 100 the grid dissolves outward from the disc in a
   jagged pixel edge, and the real disc and page come through. */
(function () {
  const cv = document.getElementById("loader"), note = document.getElementById("loaderNote");
  if (!cv) return;
  document.body.classList.add("loading");
  const ctx = cv.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BG = "#23121a", INK = "246,240,236", TH = "205,185,221";
  const MONO = "'IBM Plex Mono', Menlo, monospace";
  const MIN_LOAD = reduce ? 600 : 3400, OPEN = reduce ? 600 : 1900;
  const t0 = performance.now();
  let ready = false, openAt = 0;
  let W = 0, H = 0, dpr = 1, C = 12, cols = 0, rows = 0, cells = [], discCells = [], rimCells = [];
  let field = null, fx = null, cx = 0, cy = 0, R = 120, far = 0, levels = [], levelsFor = null;

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  function placeDisc() {
    const d = window.__disc;
    if (d && d.r > 10) { cx = d.x; cy = d.y; R = d.r; } else { cx = W / 2; cy = H * 0.45; R = Math.min(W, H) * 0.2; }
  }
  function paintCell(c) {                                   // one cell of the digit field
    fx.clearRect(c.x * C, c.y * C, C, C);
    fx.fillStyle = "rgba(" + INK + "," + c.a + ")";
    fx.fillText(c.ch, c.x * C + C / 2, c.y * C + C / 2 + 0.5);
  }
  function build() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    C = W < 700 ? 10 : 12;
    cols = Math.ceil(W / C); rows = Math.ceil(H / C);
    placeDisc();
    far = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy));
    cells = []; discCells = []; rimCells = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const px = x * C + C / 2, py = y * C + C / 2, d = Math.hypot(px - cx, py - cy);
      const bright = Math.random() < 0.05;
      const c = {
        x, y, ch: Math.random() < 0.5 ? "0" : "1",
        a: bright ? 0.42 : +(0.05 + Math.random() * 0.13).toFixed(3),
        n: Math.random(),
        key: d / far * 0.86 + Math.random() * 0.2,         // when it dissolves at the end
      };
      cells.push(c);
      if (d < R - C * 0.5) discCells.push(c);
      else if (Math.abs(d - R) < C * 0.72) {
        c.ang = ((Math.atan2(py - cy, px - cx) + Math.PI / 2) / (Math.PI * 2) + 1) % 1;
        rimCells.push(c);
      }
    }
    rimCells.sort((p, q) => p.ang - q.ang);
    field = document.createElement("canvas");
    field.width = cv.width; field.height = cv.height;
    fx = field.getContext("2d");
    fx.scale(dpr, dpr);
    fx.font = "500 " + (C * 0.8).toFixed(1) + "px " + MONO;
    fx.textAlign = "center"; fx.textBaseline = "middle";
    cells.forEach(paintCell);
    levels = []; levelsFor = null;
  }
  /* the cover at four resolutions, from chunky blocks to fine ones, tinted toward the disc */
  function buildLevels() {
    const im = window.__cover;
    if (!im || !im.width) return;
    const S = Math.max(8, Math.round(2 * R));
    levels = [C * 2, C, C / 2, 3].map((blk) => {
      const n = Math.max(4, Math.round(S / blk));
      const small = document.createElement("canvas");
      small.width = small.height = n;
      const sc = small.getContext("2d");
      const side = Math.min(im.width, im.height);
      sc.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, n, n);
      const big = document.createElement("canvas");
      big.width = big.height = Math.round(S * dpr);
      const bc = big.getContext("2d");
      bc.imageSmoothingEnabled = false;
      bc.drawImage(small, 0, 0, big.width, big.height);
      bc.globalCompositeOperation = "source-atop";
      bc.fillStyle = "rgba(" + TH + ",0.16)";
      bc.fillRect(0, 0, big.width, big.height);
      return big;
    });
    levelsFor = R;
  }

  function draw(now) {
    if (cv.style.background === "") cv.style.background = "transparent";
    placeDisc();
    if (window.__cover && (!levels.length || levelsFor !== R)) buildLevels();
    const el = (now - t0) / 1000;
    const load = clamp((now - t0) / MIN_LOAD);
    const tOpen = openAt ? clamp((now - openAt) / OPEN) : 0;
    const op = ease(tOpen);

    // a few digits flip every frame
    if (!reduce) for (let k = 0; k < Math.max(12, cells.length * 0.004); k++) {
      const c = cells[(Math.random() * cells.length) | 0];
      c.ch = c.ch === "0" ? "1" : "0";
      paintCell(c);
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = easeOut(clamp(el / 0.5));
    ctx.drawImage(field, 0, 0, W, H);
    // the scan line: a band of brighter digits drifting down the screen
    if (!reduce) {
      const bandH = C * 6, by = ((el * 0.32) % 1.25 - 0.12) * H;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, by, W, bandH); ctx.clip();
      ctx.globalAlpha = 0.9;
      ctx.drawImage(field, 0, 0, W, H);
      ctx.drawImage(field, 0, 0, W, H);
      ctx.fillStyle = "rgba(" + TH + ",0.05)";
      ctx.fillRect(0, by, W, bandH);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // the disc: the picture resolves cell by cell, sharpening as the count rises
    const lvl = load < 0.32 ? 0 : load < 0.58 ? 1 : load < 0.82 ? 2 : 3;
    if (levels[lvl]) {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(levels[lvl], cx - R, cy - R, 2 * R, 2 * R);
      ctx.restore();
    }
    ctx.font = "500 " + (C * 0.8).toFixed(1) + "px " + MONO;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const shown = clamp(load * 1.45 - 0.08);
    for (const c of discCells) {
      if (levels[lvl] && c.n < shown) continue;           // already picture
      ctx.fillStyle = BG;
      ctx.fillRect(c.x * C, c.y * C, C, C);
      // the next cells to turn are lit thistle, the rest are dim digits
      const soon = c.n < shown + 0.06;
      ctx.fillStyle = soon ? "rgba(" + TH + ",0.95)" : "rgba(" + INK + "," + (0.12 + c.a).toFixed(3) + ")";
      if (soon) ctx.fillRect(c.x * C + 1, c.y * C + 1, C - 2, C - 2);
      else ctx.fillText(c.ch, c.x * C + C / 2, c.y * C + C / 2 + 0.5);
    }
    // the rim: pixels light clockwise from the top as the progress
    for (const c of rimCells) {
      const lit = c.ang <= load;
      ctx.fillStyle = lit ? "rgba(" + TH + ",0.9)" : "rgba(" + INK + ",0.1)";
      ctx.fillRect(c.x * C + 1, c.y * C + 1, C - 2, C - 2);
    }

    // labels: name and year at the top, progress in pixel blocks at the bottom
    const hudA = (1 - clamp(op * 4)) * easeOut(clamp((el - 0.2) / 0.6));
    if (hudA > 0.01) {
      ctx.globalAlpha = hudA;
      const m = Math.max(22, Math.min(W, H) * 0.035);
      ctx.font = "500 10px " + MONO;
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0.16em";
      ctx.textBaseline = "middle";
      // small dark plates behind the text so the field never fights it
      const plate = (txt, x, y, align) => {
        const w = ctx.measureText(txt).width + 14;
        const x0 = align === "left" ? x - 7 : align === "right" ? x - w + 7 : x - w / 2;
        ctx.fillStyle = BG; ctx.fillRect(x0, y - 9, w, 18);
        ctx.fillStyle = "rgba(" + INK + ",0.85)"; ctx.textAlign = align; ctx.fillText(txt, x, y);
      };
      plate("TRINH TRINH NGUYEN", m, m, "left");
      plate("PORTFOLIO — 2026", W - m, m, "right");
      const pct = String(Math.round(load * 100)).padStart(3, "0") + "%";
      const segs = W < 700 ? 16 : 24, sw = C - 3, gap = 3, bw = segs * (sw + gap) - gap;
      const by = H - m - 4, bx = W / 2 - bw / 2;
      ctx.fillStyle = BG; ctx.fillRect(bx - 8, by - 34, bw + 16, 50);
      ctx.fillStyle = "rgba(" + INK + ",0.85)"; ctx.textAlign = "left";
      ctx.fillText("LOADING THE RECORD", bx, by - 20);
      ctx.textAlign = "right"; ctx.fillText(pct, bx + bw, by - 20);
      for (let s = 0; s < segs; s++) {
        ctx.fillStyle = s < Math.round(load * segs) ? "rgba(" + TH + ",0.95)" : "rgba(" + INK + ",0.14)";
        ctx.fillRect(bx + s * (sw + gap), by - 4, sw, sw);
      }
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      ctx.globalAlpha = 1;
    }

    // the exit: the grid dissolves outward from the disc, its edge a line of bright blocks
    if (openAt) {
      const thr = op * 1.12;
      for (let y = 0; y < rows; y++) {
        let run = -1;
        for (let x = 0; x <= cols; x++) {
          const c = x < cols ? cells[y * cols + x] : null;
          const gone = c && c.key < thr - 0.05;
          if (gone && run < 0) run = x;
          if (!gone && run >= 0) { ctx.clearRect(run * C, y * C, (x - run) * C, C); run = -1; }
          if (c && !gone && c.key < thr) {
            ctx.fillStyle = (x + y) % 3 ? "rgba(" + TH + ",0.92)" : "rgba(" + INK + ",0.95)";
            ctx.fillRect(x * C, y * C, C, C);
          }
        }
      }
    }

    if (!openAt && ready && now - t0 >= MIN_LOAD + 300) {
      openAt = now;
      note.style.opacity = "0";
    }
    if (openAt && tOpen >= 0.4 && document.body.classList.contains("loading")) {
      document.body.classList.remove("loading");          // the rest of the page follows the disc
      document.body.classList.add("intro-in");
      typeNotes();
    }
    if (openAt && tOpen >= 1) { cv.remove(); note.remove(); return; }
    requestAnimationFrame(draw);
  }
  /* the two side notes type themselves out */
  function typeNotes() {
    ["noteL", "noteR"].forEach((id, n) => {
      const box = document.getElementById(id);
      const el = box && (box.querySelector(".i-head") || box);
      if (!el) return;
      const full = el.textContent;
      if (reduce) return;
      el.setAttribute("aria-label", full);
      el.textContent = "";
      el.classList.add("typing");
      let i = 0;
      setTimeout(function tick() {
        el.textContent = full.slice(0, ++i);
        if (i < full.length) setTimeout(tick, 34 + Math.random() * 40);
        else setTimeout(() => { el.classList.remove("typing"); el.removeAttribute("aria-label"); }, 1400);
      }, 250 + n * 180);
    });
  }
  const fonts = document.fonts ? document.fonts.load("500 12px 'IBM Plex Mono'").catch(() => {}) : Promise.resolve();
  const loaded = new Promise((res) => (document.readyState === "complete" ? res() : addEventListener("load", res, { once: true })));
  const timeout = new Promise((res) => setTimeout(res, 6000));
  build();
  fonts.then(build);
  Promise.race([Promise.all([fonts, loaded]), timeout]).then(() => (ready = true));
  addEventListener("resize", build);
  requestAnimationFrame(draw);
})();
</script>

</body></html>
