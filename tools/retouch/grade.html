<!doctype html><meta charset="utf-8"><body style="margin:0;background:#111">
<img id="src" src="hero-src.jpg"><canvas id="out"></canvas>
<script>
/* Dark disc grade: soften, glow, gradient-map to wine → mauve → thistle → rose, vignette. */
window.grade = async (V) => {
  const im = document.getElementById("src"); if (V.src) im.src = V.src; await im.decode();
  const W = im.naturalWidth, H = im.naturalHeight;
  const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
  /* 1. base, and a softened copy for the retouch (skin and fabric smoothed, edges kept by mixing) */
  const base = mk(), bx = base.getContext("2d"); bx.drawImage(im, 0, 0);
  const soft = mk(), sx = soft.getContext("2d"); sx.filter = "blur(" + (W / 260).toFixed(1) + "px)"; sx.drawImage(im, 0, 0);
  bx.globalAlpha = 0.35; bx.drawImage(soft, 0, 0); bx.globalAlpha = 1;
  const d = bx.getImageData(0, 0, W, H), p = d.data;
  /* 2. gradient map, dark: the stops (luminance → colour) */
  const stops = V.stops, lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    let t = i / 255; t = Math.pow(t, V.gamma);                       // darker overall
    t = t < 0.5 ? 0.5 * Math.pow(2 * t, V.con) : 1 - 0.5 * Math.pow(2 - 2 * t, V.con);   // a soft S
    let k = 0; while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const [a, ca] = stops[k], [b, cb] = stops[k + 1], u = Math.min(1, Math.max(0, (t - a) / (b - a)));
    for (let j = 0; j < 3; j++) lut[i * 3 + j] = ca[j] + (cb[j] - ca[j]) * u;
  }
  for (let i = 0; i < p.length; i += 4) {
    const L = Math.round(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]);
    for (let j = 0; j < 3; j++) p[i + j] = lut[L * 3 + j] * (1 - V.keep) + p[i + j] * V.keep * V.keepDim;
  }
  bx.putImageData(d, 0, 0);
  /* 3. halation: the highlights, blurred wide and laid back over in rose (screen) */
  const glow = mk(), gx = glow.getContext("2d");
  gx.filter = "blur(" + (W / 45).toFixed(1) + "px) brightness(" + V.glowB + ") contrast(1.6)"; gx.drawImage(base, 0, 0);
  bx.globalCompositeOperation = "screen"; bx.globalAlpha = V.glow; bx.drawImage(glow, 0, 0);
  bx.globalCompositeOperation = "source-over"; bx.globalAlpha = 1;
  /* 4. vignette into the wine */
  const vg = bx.createRadialGradient(W * 0.55, H * 0.42, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  vg.addColorStop(0, "rgba(22,4,9,0)"); vg.addColorStop(1, "rgba(22,4,9," + V.vig + ")");
  bx.fillStyle = vg; bx.fillRect(0, 0, W, H);
  const out = document.getElementById("out"); out.width = W; out.height = H; out.getContext("2d").drawImage(base, 0, 0);
  return out.toDataURL("image/jpeg", 0.86);
};
</script>
